name: medicalsys

# Sonda comun de los servicios Java. depends_on por si solo espera a que el contenedor
# arranque, no a que la aplicacion este lista: sin esto, ms-marketing consultaba a
# ms-pacientes mientras Spring todavia levantaba y se caia en el arranque.
x-service-healthcheck: &medicalsys-healthcheck
  test: ["CMD-SHELL", "curl --fail --silent http://localhost:$${SERVER_PORT}/actuator/health || exit 1"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

# Politica de retencion de logs (OWASP A09 - LOG-03): rotacion local a 10 MB por archivo,
# maximo 3 archivos por contenedor (~30 MB por servicio). Aplicada a todos los servicios via
# este ancla para evitar que los logs llenen el disco del host sin perder trazabilidad reciente.
x-logging: &medicalsys-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Un solo MySQL local para todos los microservicios. Cada servicio conserva su
  # propia base y su propio usuario para que sus migraciones Flyway permanezcan aisladas.
  mysql:
    image: mysql:8.4
    command:
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicalsys-root-local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
    logging: *medicalsys-logging

  # Crea bases y usuarios en cada arranque. Es idempotente, asi que tambien funciona sobre un
  # volumen mysql_data ya existente (docker-entrypoint-initdb.d solo corre con el volumen vacio).
  mysql-init:
    image: mysql:8.4
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-medicalsys-root-local}
      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD:-identidad-local}
      TENENCIA_DB_PASSWORD: ${TENENCIA_DB_PASSWORD:-tenencia-local}
      CATALOGOS_DB_PASSWORD: ${CATALOGOS_DB_PASSWORD:-catalogos-local}
      CRIPTOGRAFIA_DB_PASSWORD: ${CRIPTOGRAFIA_DB_PASSWORD:-criptografia-local}
      PACIENTES_DB_PASSWORD: ${PACIENTES_DB_PASSWORD:-pacientes-local}
      PROFESIONALES_DB_PASSWORD: ${PROFESIONALES_DB_PASSWORD:-profesionales-local}
      HISTORIAL_DB_PASSWORD: ${HISTORIAL_DB_PASSWORD:-historial-local}
      DOCUMENTAL_DB_PASSWORD: ${DOCUMENTAL_DB_PASSWORD:-documental-local}
      FACTURACION_DB_PASSWORD: ${FACTURACION_DB_PASSWORD:-facturacion-local}
      NOTIFICACIONES_DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones-local}
      MARKETING_DB_PASSWORD: ${MARKETING_DB_PASSWORD:-marketing-local}
      AUDITORIA_DB_PASSWORD: ${AUDITORIA_DB_PASSWORD:-auditoria-local}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./infra/mysql/init:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/01-create-databases.sh"]
    restart: "no"
    logging: *medicalsys-logging

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scheduling_db
      POSTGRES_USER: scheduling_user
      POSTGRES_PASSWORD: ${AGENDA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *medicalsys-logging

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    logging: *medicalsys-logging

  minio:
    # quay.io/minio/* dejo de ser descargable sin credenciales (401). Imagen oficial de MinIO
    # reconstruida por Chainguard; la variante -dev trae shell y wget para el healthcheck.
    image: cgr.dev/chainguard/minio:latest-dev
    # La imagen corre como no-root por defecto y el volumen nuevo es de root.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://localhost:9000/minio/health/live || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: *medicalsys-logging

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-medicalsys-documents-local}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    restart: "no"
    logging: *medicalsys-logging

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "6"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *medicalsys-logging

  kafka-init:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    restart: "no"
    logging: *medicalsys-logging

  # IAM-01: Keycloak usa su propia base «keycloak» dentro del Postgres existente. Este paso
  # crea el rol y la base si faltan; es idempotente, así que corre en cada arranque.
  keycloak-db-init:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: scheduling_user
      PGDATABASE: scheduling_db
      PGPASSWORD: ${AGENDA_DB_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?falta KEYCLOAK_DB_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./infra/keycloak/create-database.sh:/scripts/create-database.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-database.sh"]
    restart: "no"
    logging: *medicalsys-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    # --import-realm importa infra/keycloak/realm-medicalsys.json solo si el realm no existe.
    # Para aplicar cambios del archivo a un realm ya creado: infra/keycloak/sync-realm.sh.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?falta KEYCLOAK_DB_PASSWORD en .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?falta KEYCLOAK_ADMIN_PASSWORD en .env}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      # Referencia ${KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET} del realm: el secreto no se versiona.
      KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET: ${KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET:?falta KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET en .env}
    ports:
      # Consola de administración y token endpoint para la demo y las pruebas. Los servicios
      # usan la red de Compose (http://keycloak:8080).
      - "${KEYCLOAK_HOST_PORT:-18080}:8080"
    volumes:
      - ./infra/keycloak/realm-medicalsys.json:/opt/keycloak/data/import/realm-medicalsys.json:ro
      # Lista negra de la política de contraseñas (IAM-02): passwordBlacklist(medicalsys.txt).
      - ./infra/keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    healthcheck:
      # La imagen no trae curl. Igual que en DoggyCredit, basta con que el puerto acepte
      # conexiones: --health-enabled fuerza una re-augmentación de Quarkus en cada arranque.
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/127.0.0.1/8080) 2>/dev/null'"]
      interval: 10s
      timeout: 10s
      # En un VPS pequeno el primer arranque (importar el realm) pasa de 5 minutos: 90 x 10 s = 15 min.
      retries: 90
      start_period: 40s
    logging: *medicalsys-logging

  ms-identidad:
    build:
      context: ./services/ms-identidad
      dockerfile: Dockerfile
    image: medicalsys/ms-identidad:local
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: identity_user
      DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD:-identidad-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET}
      IDENTITY_DEMO_USERS_ENABLED: ${IDENTITY_DEMO_USERS_ENABLED:-false}
      # En un despliegue publico hay que cambiarla: la de por defecto esta en el README.
      IDENTITY_DEMO_PASSWORD: ${IDENTITY_DEMO_PASSWORD:-SanGabriel.Demo26!}
      IDENTITY_DEMO_ORGANIZATION: ${IDENTITY_DEMO_ORGANIZATION:-00000000-0000-4000-8000-0000000000a1}
      PLATFORM_ADMIN_SEED_ENABLED: ${PLATFORM_ADMIN_SEED_ENABLED:-false}
      PLATFORM_ADMIN_PUBLIC_ID: ${PLATFORM_ADMIN_PUBLIC_ID:-00000000-0000-4000-8000-000000000900}
      PLATFORM_ADMIN_ORGANIZATION: ${PLATFORM_ADMIN_ORGANIZATION:-00000000-0000-4000-8000-0000000000a1}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform.admin@medicalsys.demo}
      PLATFORM_ADMIN_FULL_NAME: ${PLATFORM_ADMIN_FULL_NAME:-Administrador de MedicalSys}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # LOG-01/LOG-02: login, ABM, contrasenas, roles y denegaciones hacia la bitacora. Vacio lo desactiva.
      AUDIT_SERVICE_URL: http://ms-auditoria:8091
      # IAM-03: las credenciales se validan contra Keycloak (cliente confidencial ms-identidad).
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET:?falta KEYCLOAK_MS_IDENTIDAD_CLIENT_SECRET en .env}
    depends_on:
      keycloak:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-tenencia:
    build:
      context: ./services/ms-tenencia
      dockerfile: Dockerfile
    image: medicalsys/ms-tenencia:local
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:mysql://mysql:3306/tenancy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tenancy_user
      DB_PASSWORD: ${TENENCIA_DB_PASSWORD:-tenencia-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-catalogos:
    build:
      context: ./services/ms-catalogos
      dockerfile: Dockerfile
    image: medicalsys/ms-catalogos:local
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:mysql://mysql:3306/catalogs_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: catalogs_user
      DB_PASSWORD: ${CATALOGOS_DB_PASSWORD:-catalogos-local}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-criptografia:
    build:
      context: ./services/ms-criptografia
      dockerfile: Dockerfile
    image: medicalsys/ms-criptografia:local
    environment:
      SERVER_PORT: "8084"
      DB_URL: jdbc:mysql://mysql:3306/cryptography_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: cryptography_user
      DB_PASSWORD: ${CRIPTOGRAFIA_DB_PASSWORD:-criptografia-local}
      DEMO_MASTER_KEY: ${DEMO_MASTER_KEY}
      CRYPTO_SERVICE_SHARED_SECRET: ${CRYPTO_SERVICE_SHARED_SECRET}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-pacientes:
    build:
      context: ./services/ms-pacientes
      dockerfile: Dockerfile
    image: medicalsys/ms-pacientes:local
    environment:
      SERVER_PORT: "8085"
      DB_URL: jdbc:mysql://mysql:3306/patients_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: patients_user
      DB_PASSWORD: ${PACIENTES_DB_PASSWORD:-pacientes-local}
      FLYWAY_LOCATIONS: ${PACIENTES_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUDIT_SERVICE_URL: http://ms-auditoria:8091
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      # El envio a la bitacora es tolerante a fallos por diseno -no tumba el alta de un
      # paciente-, pero sin esta espera los eventos de la siembra se perderian por
      # llegar antes de que ms-auditoria acepte conexiones.
      ms-auditoria:
        condition: service_healthy
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-profesionales:
    build:
      context: ./services/ms-profesionales
      dockerfile: Dockerfile
    image: medicalsys/ms-profesionales:local
    environment:
      SERVER_PORT: "8086"
      DB_URL: jdbc:mysql://mysql:3306/professionals_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: professionals_user
      DB_PASSWORD: ${PROFESIONALES_DB_PASSWORD:-profesionales-local}
      FLYWAY_LOCATIONS: ${PROFESIONALES_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-agenda:
    build:
      context: ./services/ms-agenda
      dockerfile: Dockerfile
    image: medicalsys/ms-agenda:local
    environment:
      SERVER_PORT: "8087"
      DB_URL: jdbc:postgresql://postgres:5432/scheduling_db
      DB_USER: scheduling_user
      DB_PASSWORD: ${AGENDA_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FLYWAY_LOCATIONS: ${AGENDA_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      # Con la validacion apagada la agenda aceptaba citas contra pacientes y profesionales
      # que no existen. Ya corregida la ruta del contrato con ms-pacientes, se activa.
      SCHEDULING_VALIDATION_ENABLED: ${SCHEDULING_VALIDATION_ENABLED:-true}
      PATIENTS_BASE_URL: http://ms-pacientes:8085
      PROFESSIONALS_BASE_URL: http://ms-profesionales:8086
    depends_on:
      ms-pacientes:
        condition: service_healthy
      ms-profesionales:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-historial:
    build:
      context: ./services/ms-historial
      dockerfile: Dockerfile
    image: medicalsys/ms-historial:local
    environment:
      SERVER_PORT: "8088"
      DB_URL: jdbc:mysql://mysql:3306/medical_records_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: medical_records_user
      DB_PASSWORD: ${HISTORIAL_DB_PASSWORD:-historial-local}
      FLYWAY_LOCATIONS: ${HISTORIAL_FLYWAY_LOCATIONS:-classpath:db/migration,classpath:db/demo}
      # El modo LOCAL solo aceptaba cuatro codigos CIE-10 fijos en application.yaml, asi que
      # cualquier diagnostico elegido en la interfaz desde el catalogo real de ms-catalogos se
      # rechazaba con 422. REMOTE valida contra ms-catalogos, que es la unica fuente del
      # catalogo vigente.
      CATALOGS_VALIDATION_MODE: ${HISTORIAL_CATALOGS_MODE:-REMOTE}
      CATALOGS_BASE_URL: http://ms-catalogos:8083
      DEMO_MASTER_KEY: ${DEMO_MASTER_KEY}
      CRYPTO_SERVICE_SHARED_SECRET: ${CRYPTO_SERVICE_SHARED_SECRET}
      MEDICAL_RECORDS_DEMO_SEED: ${MEDICAL_RECORDS_DEMO_SEED:-true}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      ms-catalogos:
        condition: service_healthy
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-documental:
    build:
      context: ./services/ms-documental
      dockerfile: Dockerfile
    image: medicalsys/ms-documental:local
    environment:
      SERVER_PORT: "8089"
      DB_URL: jdbc:mysql://mysql:3306/documents_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: documents_user
      DB_PASSWORD: ${DOCUMENTAL_DB_PASSWORD:-documental-local}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-medicalsys-documents-local}
      DOCUMENT_MAX_SIZE_BYTES: ${DOCUMENT_MAX_SIZE_BYTES:-104857600}
      PATIENTS_SERVICE_URL: http://ms-pacientes:8085
      NOTIFICATIONS_SERVICE_URL: http://ms-notificaciones:8091
      # CRY-02/LOG-02: eventos de verificacion de integridad hacia la bitacora.
      AUDIT_SERVICE_URL: http://ms-auditoria:8091
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-facturacion:
    build:
      context: ./services/ms-facturacion
      dockerfile: Dockerfile
    image: medicalsys/ms-facturacion:local
    environment:
      SERVER_PORT: "8090"
      DB_URL: jdbc:mysql://mysql:3306/billing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: billing_user
      DB_PASSWORD: ${FACTURACION_DB_PASSWORD:-facturacion-local}
      # Modos remotos: el cliente de la factura sale de ms-pacientes y el precio de la
      # prestacion de ms-tenencia. En LOCAL, facturacion derivaba un cliente ficticio del UUID
      # y solo conocia dos prestaciones, de modo que cobrar cualquier otra era imposible.
      PATIENTS_MODE: ${BILLING_PATIENTS_MODE:-REMOTE}
      PATIENTS_BASE_URL: http://ms-pacientes:8085
      TENANCY_MODE: ${BILLING_TENANCY_MODE:-REMOTE}
      TENANCY_BASE_URL: http://ms-tenencia:8082
      BILLING_DEMO_NIT: ${BILLING_DEMO_NIT:-1023847026}
      BILLING_DEMO_LEGAL_NAME: ${BILLING_DEMO_LEGAL_NAME:-POLICLINICO SAN GABRIEL S.R.L.}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      ms-pacientes:
        condition: service_healthy
      ms-tenencia:
        condition: service_healthy
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-marketing:
    build:
      context: ./services/ms-marketing
      dockerfile: Dockerfile
    image: medicalsys/ms-marketing:local
    environment:
      SERVER_PORT: "8092"
      DB_URL: jdbc:mysql://mysql:3306/marketing_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: marketing_user
      DB_PASSWORD: ${MARKETING_DB_PASSWORD:-marketing-local}
      # Modos remotos: marketing consulta la demografia real de ms-pacientes y las
      # prestaciones reales de ms-tenencia en vez de derivarlas del UUID.
      PATIENTS_MODE: ${MARKETING_PATIENTS_MODE:-REMOTE}
      PATIENTS_BASE_URL: http://ms-pacientes:8085
      TENANCY_MODE: ${MARKETING_TENANCY_MODE:-REMOTE}
      TENANCY_BASE_URL: http://ms-tenencia:8082
      MARKETING_DEMO_SEED: ${MARKETING_DEMO_SEED:-true}
      MARKETING_DEMO_ORGANIZATION: ${IDENTITY_DEMO_ORGANIZATION:-00000000-0000-4000-8000-0000000000a1}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKETING_OUTBOX_MODE: ${MARKETING_OUTBOX_MODE:-KAFKA}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      ms-pacientes:
        condition: service_healthy
      ms-tenencia:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-auditoria:
    build:
      context: ./services/ms-auditoria
      dockerfile: Dockerfile
    image: medicalsys/ms-auditoria:local
    environment:
      SERVER_PORT: "8091"
      DB_URL: jdbc:mysql://mysql:3306/audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: audit_user
      DB_PASSWORD: ${AUDITORIA_DB_PASSWORD:-auditoria-local}
      AUDIT_DEMO_SEED: ${AUDITORIA_DEMO_SEED:-false}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  ms-notificaciones:
    build:
      context: ./services/ms-notificaciones
      dockerfile: Dockerfile
    image: medicalsys/ms-notificaciones:local
    environment:
      SERVER_PORT: "8091"
      DB_URL: jdbc:mysql://mysql:3306/notifications_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: notifications_user
      DB_PASSWORD: ${NOTIFICACIONES_DB_PASSWORD:-notificaciones-local}
      R2DBC_URL: r2dbc:mysql://mysql:3306/notifications_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MARKETING_SERVICE_URL: http://ms-marketing:8092
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      NOTIFICATION_KAFKA_ENABLED: ${NOTIFICATION_KAFKA_ENABLED:-true}
      WHATSAPP_MANUAL_SEND_ENABLED: ${WHATSAPP_MANUAL_SEND_ENABLED:-true}
      WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-local-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
    depends_on:
      mysql-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    logging: *medicalsys-logging

  ms-gateway:
    build:
      context: ./services/ms-gateway
      dockerfile: Dockerfile
    image: medicalsys/ms-gateway:local
    environment:
      SERVER_PORT: "8080"
      IDENTITY_SERVICE_URL: http://ms-identidad:8081
      TENANCY_SERVICE_URL: http://ms-tenencia:8082
      CATALOGS_SERVICE_URL: http://ms-catalogos:8083
      CRYPTOGRAPHY_SERVICE_URL: http://ms-criptografia:8084
      PATIENTS_SERVICE_URL: http://ms-pacientes:8085
      PROFESSIONALS_SERVICE_URL: http://ms-profesionales:8086
      SCHEDULING_SERVICE_URL: http://ms-agenda:8087
      MEDICAL_RECORDS_SERVICE_URL: http://ms-historial:8088
      DOCUMENTS_SERVICE_URL: http://ms-documental:8089
      BILLING_SERVICE_URL: http://ms-facturacion:8090
      NOTIFICATIONS_SERVICE_URL: http://ms-notificaciones:8091
      MARKETING_SERVICE_URL: http://ms-marketing:8092
      AUDIT_SERVICE_URL: http://ms-auditoria:8091
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    # El gateway solo enruta, pero arrancar antes que sus destinos hace que las primeras
    # peticiones del frontend devuelvan 503 sin motivo aparente.
    depends_on:
      # Sin Redis el gateway no puede comprobar la sesion y responde 503 a todo token.
      redis:
        condition: service_healthy
      ms-identidad:
        condition: service_healthy
      ms-tenencia:
        condition: service_healthy
      ms-catalogos:
        condition: service_healthy
      ms-pacientes:
        condition: service_healthy
      ms-profesionales:
        condition: service_healthy
      ms-agenda:
        condition: service_healthy
      ms-historial:
        condition: service_healthy
      ms-facturacion:
        condition: service_healthy
      ms-marketing:
        condition: service_healthy
      ms-auditoria:
        condition: service_healthy
    healthcheck: *medicalsys-healthcheck
    logging: *medicalsys-logging

  # Publicacion por tunel de Cloudflare (DEP-01). Solo arranca con --profile publico.
  # No publica puertos: sale hacia Cloudflare y alcanza al gateway por la red interna.
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["publico"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      ms-gateway:
        condition: service_healthy
    restart: unless-stopped
    logging: *medicalsys-logging

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:

networks:
  default:
    name: medicalsys-interna
