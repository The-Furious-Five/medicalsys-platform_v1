name: medicalsys

services:
  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      IDENTIDAD_DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD}
      TENENCIA_DB_PASSWORD: ${TENENCIA_DB_PASSWORD}
      CATALOGOS_DB_PASSWORD: ${CATALOGOS_DB_PASSWORD}
      CRIPTOGRAFIA_DB_PASSWORD: ${CRIPTOGRAFIA_DB_PASSWORD}
      PACIENTES_DB_PASSWORD: ${PACIENTES_DB_PASSWORD}
      PROFESIONALES_DB_PASSWORD: ${PROFESIONALES_DB_PASSWORD}
      HISTORIAL_DB_PASSWORD: ${HISTORIAL_DB_PASSWORD}
      DOCUMENTAL_DB_PASSWORD: ${DOCUMENTAL_DB_PASSWORD}
      FACTURACION_DB_PASSWORD: ${FACTURACION_DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
	  "CMD-SHELL",
	  "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
	]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s


  ms-tenencia:
    build:
      context: ./services/ms-tenencia
      dockerfile: Dockerfile

    image: medicalsys/ms-tenencia:local

    environment:
      SERVER_PORT: "8082"

      DB_URL: jdbc:mysql://mysql:3306/tenancy_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: tenancy_user
      DB_PASSWORD: ${TENENCIA_DB_PASSWORD}

      # Temporal: V1__create_schema.sql todavía está vacío.
      SPRING_FLYWAY_ENABLED: "false"

    ports:
      - "${TENANCY_HOST_PORT:-8082}:8082"

    depends_on:
      mysql:
        condition: service_healthy


  ms-gateway:
    build:
      context: ./services/ms-gateway
      dockerfile: Dockerfile

    image: medicalsys/ms-gateway:local

    environment:
      SERVER_PORT: "8080"
      TENANCY_SERVICE_URL: http://ms-tenencia:8082

    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"

    depends_on:
      ms-tenencia:
        condition: service_started


volumes:
  mysql_data:
