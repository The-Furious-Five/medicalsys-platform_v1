# Capa de produccion sobre compose.yaml + compose.local.yaml (MySQL en Docker).
# - Las imagenes vienen de GHCR (las construye el workflow deploy.yml), no se compilan en el VPS.
# - Ningun puerto de servicio se publica: solo Caddy expone 80/443 y reenvia al frontend.
# El VPS define COMPOSE_FILE en .env, asi que alli basta `docker compose ...`.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  ms-identidad:
    image: ghcr.io/the-furious-five/medicalsys-ms-identidad:latest
    build: !reset null
    restart: unless-stopped
    ports: !reset []
