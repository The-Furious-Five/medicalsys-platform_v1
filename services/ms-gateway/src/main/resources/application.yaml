server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ms-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/identity/**

            - id: tenancy-service
              uri: ${TENANCY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tenancy/**

            - id: catalogs-service
              uri: ${CATALOGS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/catalogs/**
            
            - id: cryptography-service
              uri: ${CRYPTOGRAPHY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/cryptography/**

            - id: patients-service
              uri: ${PATIENTS_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/patients/**

            - id: professionals-service
              uri: ${PROFESSIONALS_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/professionals/**

            - id: scheduling-service
              uri: ${SCHEDULING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/scheduling/**

            - id: medical-records-service
              uri: ${MEDICAL_RECORDS_SERVICE_URL:http://localhost:8088}
              predicates:
                # /api/v1/medical-records/** solo cubre el ping; los controladores reales de
                # ms-historial quedaron montados en estas rutas (ver web/controller/*.java) y
                # nunca se actualizo este predicado. Sin esto, el gateway devuelve 404 para todo
                # encuentro/diagnostico/orden de estudio/expediente pedido a traves suyo.
                - Path=/api/v1/medical-records/**,/api/v1/encuentros/**,/api/v1/expedientes/**,/api/v1/ordenes-estudio/**,/api/v1/diagnosticos/**,/api/v1/alergias/**,/api/v1/antecedentes/**,/api/v1/recetas/**

            - id: documents-service
              uri: ${DOCUMENTS_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/documents/**

            - id: marketing-service
              uri: ${MARKETING_SERVICE_URL:http://localhost:8092}
              predicates:
                # Igual que historial y facturacion: /api/v1/marketing/** solo cubre el ping
                # y los criterios permitidos. Los controladores reales de ms-marketing viven
                # en rutas en espanol (web/controller/*.java), que son las que consume el
                # frontend. /api/v1/pacientes/** es de marketing (actividad y opt-out) y no
                # colisiona con /api/v1/patients/** de ms-pacientes.
                - Path=/api/v1/marketing/**,/api/v1/campanas/**,/api/v1/segmentos/**,/api/v1/promociones/**,/api/v1/anuncios/**,/api/v1/fidelidad/**,/api/v1/pacientes/**

            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8091}
              predicates:
                # Solo el prefijo publico. /internal/v1/audit-events queda deliberadamente
                # fuera del gateway: la bitacora se escribe entre servicios, nunca desde el
                # navegador, o cualquiera podria fabricar la prueba de lo que no hizo.
                - Path=/api/v1/audit/**

            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://localhost:8090}
              predicates:
                # /api/v1/billing/** solo cubre el ping; InvoiceController real vive en
                # /api/v1/facturas (ver web/controller/InvoiceController.java).
                - Path=/api/v1/billing/**,/api/v1/facturas/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
