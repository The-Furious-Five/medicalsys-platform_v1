# =====================================================================================
# ms-marketing - configuracion base.
# No contiene localhost ni secretos: Compose inyecta DB_URL, DB_USER y DB_PASSWORD.
# Para ejecutar fuera de Docker usar el perfil "local" (application-local.yaml).
#
# Notese lo que NO hay en este archivo: ninguna propiedad que apunte a ms-historial ni a
# medical_records_db. No es un olvido; es la frontera de privacidad. ms-marketing no tiene
# credenciales del expediente ni ruta de red hacia el, y no existe configuracion con la
# que activarlo.
# =====================================================================================
server:
  port: ${SERVER_PORT:8092}
  # El JWT lleva el claim permissions del catalogo granular (RBAC-01): el de un administrador
  # supera los 7 KB y los 8 KB por defecto de Tomcat no dejan margen para el resto de cabeceras.
  max-http-request-header-size: 32KB
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ms-marketing
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # El pool se dimensiona por servicio y no de forma uniforme: es la ventaja concreta de
      # haber separado las bases. Marketing es el servicio de menor criticidad del sistema y
      # no necesita el mismo pool que el que emite facturas.
      pool-name: marketing-pool
      maximum-pool-size: ${DB_POOL_SIZE:8}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea y evoluciona el esquema; Hibernate solo comprueba su correspondencia.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    # Los campos nulos no viajan en la respuesta y las fechas salen en ISO-8601, no como
    # numero de epoch (Jackson 3 mueve la opcion a datatype.datetime).
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  service: ms-marketing
  responsibility: campanas, segmentacion, cupones y fidelizacion
  database: marketing_db
  publishes: marketing.campana
  privacy: >-
    La segmentacion solo usa datos administrativos y demograficos. marketing_db no contiene
    ninguna tabla clinica y este servicio no tiene credenciales ni cliente hacia ms-historial.

medicalsys:
  patients:
    # LOCAL:  deriva demografia ficticia y determinista del propio UUID del paciente.
    # REMOTE: consulta ms-pacientes por HTTP (GET /internal/v1/patients/{id}).
    mode: ${PATIENTS_MODE:LOCAL}
    base-url: ${PATIENTS_BASE_URL:http://ms-pacientes:8085}
    connect-timeout: 2s
    read-timeout: 3s
  tenancy:
    # LOCAL:  deriva la prestacion del propio UUID.
    # REMOTE: consulta ms-tenencia por HTTP (GET /internal/v1/prestaciones/{id}).
    mode: ${TENANCY_MODE:LOCAL}
    base-url: ${TENANCY_BASE_URL:http://ms-tenencia:8082}
    connect-timeout: 2s
    read-timeout: 3s
  entitlement:
    # Criterio C5: el modulo es opcional por contrato. REPLICA respeta
    # ref_organization.includes_marketing, alimentado por eventos de ms-tenencia.
    mode: ${ENTITLEMENT_MODE:REPLICA}
    # Que asumir para un tenant del que todavia no llego el plan. En local, incluido.
    default-included: ${MARKETING_DEFAULT_INCLUDED:true}
    # Tenants a los que se niega el modulo aunque su replica diga otra cosa. Sirve para
    # demostrar el 403 MARKETING_NOT_INCLUDED_IN_PLAN sin tocar ms-tenencia.
    excluded-tenants: ${MARKETING_EXCLUDED_TENANTS:}
  audience:
    # Tope de destinatarios de una campana. Protege de que un criterio demasiado amplio
    # materialice una audiencia sin fin dentro de una sola transaccion.
    max-size: ${MARKETING_AUDIENCE_MAX:10000}
  outbox:
    # LOG    : el relay registra cada evento y lo marca publicado (sin broker real).
    # RETAIN : los eventos se acumulan para que un relay externo los drene por
    #          GET /internal/v1/eventos/salientes.
    # KAFKA  : el relay publica de verdad en el topico marketing.campana.
    mode: ${MARKETING_OUTBOX_MODE:LOG}
    batch-size: ${MARKETING_OUTBOX_BATCH:100}
    interval-ms: ${MARKETING_OUTBOX_INTERVAL_MS:5000}
  demo:
    # Siembra tenant replicado, programa de fidelidad, cupon y pacientes con actividad, para
    # que el servicio sea usable desde una base vacia. Se desactiva fuera del entorno local.
    seed-on-startup: ${MARKETING_DEMO_SEED:true}
    organization-id: ${MARKETING_DEMO_ORGANIZATION:00000000-0000-4000-8000-0000000000a1}
    organization-name: CLINICA DEMO MEDICALSYS
    loyalty-program-name: PUNTOS DEMO MEDICALSYS
    coupon-code: ${MARKETING_DEMO_COUPON:DEMO10}
    patients: ${MARKETING_DEMO_PATIENTS:12}

logging:
  level:
    root: INFO
    com.medicalsys.marketing: ${LOG_LEVEL:INFO}
    org.flywaydb: INFO
