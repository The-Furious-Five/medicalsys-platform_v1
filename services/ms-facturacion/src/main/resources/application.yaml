# =====================================================================================
# ms-facturacion - configuracion base.
# No contiene localhost ni secretos: Compose inyecta DB_URL, DB_USER y DB_PASSWORD.
# Para ejecutar fuera de Docker usar el perfil "local" (application-local.yaml).
#
# Ninguna clave de este archivo es una credencial del SIN: el MVP no usa ninguna.
# =====================================================================================
server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ms-facturacion
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: facturacion-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway crea y evoluciona el esquema; Hibernate solo comprueba su correspondencia.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
  jackson:
    # Los campos nulos no viajan en la respuesta y las fechas salen en ISO-8601, no como
    # numero de epoch (Jackson 3 mueve la opcion a datatype.datetime).
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  info:
    env:
      enabled: true

info:
  service: ms-facturacion
  responsibility: factura, detalle, correlativo y estado de demostracion
  database: billing_db
  fiscal-disclaimer: adaptador SIN simulado; los documentos no tienen validez tributaria

medicalsys:
  patients:
    # LOCAL:  deriva un DTO fiscal ficticio y determinista del propio UUID del paciente.
    # REMOTE: consulta ms-pacientes por HTTP.
    mode: ${PATIENTS_MODE:LOCAL}
    base-url: ${PATIENTS_BASE_URL:http://ms-pacientes:8085}
    connect-timeout: 2s
    read-timeout: 3s
  tenancy:
    # LOCAL:  usa el catalogo de prestaciones declarado mas abajo, con sus precios.
    # REMOTE: consulta ms-tenencia por HTTP.
    mode: ${TENANCY_MODE:LOCAL}
    base-url: ${TENANCY_BASE_URL:http://ms-tenencia:8082}
    connect-timeout: 2s
    read-timeout: 3s
    local:
      # Mismas prestaciones ficticias que ms-tenencia siembra en el entorno local. Al pasar
      # a REMOTE esta lista deja de usarse.
      offerings:
        - id: 00000000-0000-4000-8000-000000000501
          code: CONSULTATION
          name: Consulta medica general (demostracion)
          base-price-bob: 150.00
          tax-product-code: "99100"
          tax-unit-code: 58
        - id: 00000000-0000-4000-8000-000000000502
          code: X_RAY
          name: Estudio de rayos X (demostracion)
          base-price-bob: 250.00
          tax-product-code: "99200"
          tax-unit-code: 58
  tax-authority:
    # SIMULATED es el unico modo implementado: stub determinista, sin red ni credenciales.
    mode: ${TAX_AUTHORITY_MODE:SIMULATED}
    demo-caption: ${TAX_AUTHORITY_DEMO_CAPTION:NO VALIDA TRIBUTARIAMENTE - DOCUMENTO DE DEMOSTRACION SIN VALOR FISCAL}
    demo-prefix: DEMO
  billing:
    # CAEB ficticio del entorno local; la tabla economic_activity llega en una V2.
    economic-activity-code: ${BILLING_ECONOMIC_ACTIVITY_CODE:861020}
    fallback-tax-product-code: "99100"
    demo-setup:
      # Crea configuracion fiscal, punto de venta y CUIS/CUFD simulados si el tenant no los
      # tiene. Permite emitir desde una base vacia sin ningun paso manual.
      # En un entorno real se desactiva: la configuracion la carga un administrador.
      enabled: ${BILLING_DEMO_SETUP:true}
      nit: ${BILLING_DEMO_NIT:0000000000}
      legal-name: ${BILLING_DEMO_LEGAL_NAME:CLINICA DEMO MEDICALSYS}
      point-of-sale-name: CAJA DEMO
      tax-branch-code: 0
      point-of-sale-code: 1
      address: DIRECCION DE DEMOSTRACION - ENTORNO LOCAL
      cuis-validity: 365d
      # Emite unas facturas al arrancar con la tabla vacia, llamando al propio servicio.
      seed-invoices: ${BILLING_DEMO_INVOICES:true}
      cufd-validity: 24h

logging:
  level:
    root: INFO
    com.medicalsys.facturacion: ${LOG_LEVEL:INFO}
    org.flywaydb: INFO
