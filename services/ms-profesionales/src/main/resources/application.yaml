server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: ms-profesionales

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # db/demo solo se carga cuando Compose lo pide (FLYWAY_LOCATIONS). Un despliegue
    # real arranca sin la plantilla de demostracion, igual que ms-pacientes.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

management:
  endpoints:
    web:
      exposure:
        include: health,info
