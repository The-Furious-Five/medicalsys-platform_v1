server:
  port: ${SERVER_PORT:8086}
  # El JWT lleva el claim permissions del catalogo granular (RBAC-01): el de un administrador
  # supera los 7 KB y los 8 KB por defecto de Tomcat no dejan margen para el resto de cabeceras.
  max-http-request-header-size: 32KB

spring:
  application:
    name: ms-profesionales

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    # db/demo solo se carga cuando Compose lo pide (FLYWAY_LOCATIONS). Un despliegue
    # real arranca sin la plantilla de demostracion, igual que ms-pacientes.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

management:
  endpoints:
    web:
      exposure:
        include: health,info
