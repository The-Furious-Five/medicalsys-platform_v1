server:
  port: ${SERVER_PORT:8084}
  # El JWT lleva el claim permissions del catalogo granular (RBAC-01): el de un administrador
  # supera los 7 KB y los 8 KB por defecto de Tomcat no dejan margen para el resto de cabeceras.
  max-http-request-header-size: 32KB

spring:
  application:
    name: ms-criptografia

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

medicalsys:
  service-auth:
    # Secreto que debe traer todo llamador en X-Service-Secret (junto con X-Service-Name, que solo
    # etiqueta al llamador en la bitacora de uso). Sin este par, /internal/v1/** rechaza con 401 —
    # antes cualquier proceso con acceso de red al puerto podia cifrar/descifrar narrativa clinica de
    # cualquier organizacion con solo mandar un organizationId valido.
    shared-secret: ${CRYPTO_SERVICE_SHARED_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
