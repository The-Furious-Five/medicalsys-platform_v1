server:
  port: 0

spring:
  application:
    name: ms-catalogos-test

  datasource:
    url: jdbc:h2:mem:catalogs_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Las migraciones son especificas de MySQL (indices por prefijo y ENGINE).
      # El test unitario usa H2 solo para comprobar el contexto y mapeos JPA.
      ddl-auto: create-drop

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
