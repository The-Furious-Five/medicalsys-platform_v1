server:
  port: ${SERVER_PORT:8083}
  # El JWT lleva el claim permissions del catalogo granular (RBAC-01): el de un administrador
  # supera los 7 KB y los 8 KB por defecto de Tomcat no dejan margen para el resto de cabeceras.
  max-http-request-header-size: 32KB

spring:
  application:
    name: ms-catalogos

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized
