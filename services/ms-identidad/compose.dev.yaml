# Entorno local aislado para probar SOLO ms-identidad.
#
# No reemplaza al compose.yaml de la raiz, que es el entorno compartido y lo administra el
# equipo de integracion. Este archivo existe para que cualquiera pueda levantar el servicio
# con sus dependencias sin depender del resto de la plataforma:
#
#   docker compose -f services/ms-identidad/compose.dev.yaml up -d --build
#   bash services/ms-identidad/scripts/smoke.sh http://localhost:8081
#   docker compose -f services/ms-identidad/compose.dev.yaml down -v
#
# Las contrasenas de abajo son de desarrollo local y no son secretas: la base solo escucha en
# esta red de Compose. Se pueden sobreescribir exportando las variables antes de levantar.

name: ms-identidad-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: identity_db
      MYSQL_USER: identity_user
      MYSQL_PASSWORD: ${IDENTIDAD_DB_PASSWORD:-identity_pass}
    ports:
      # Puerto desplazado para no chocar con un MySQL instalado en la maquina.
      - "13306:3306"
    volumes:
      - identity-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devroot}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ms-identidad:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:mysql://mysql:3306/identity_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: identity_user
      DB_PASSWORD: ${IDENTIDAD_DB_PASSWORD:-identity_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Minimo 32 bytes. En el entorno compartido lo provee el .env de la raiz.
      JWT_SECRET: ${JWT_SECRET:-reemplazalo-con-secreto-local-demostrativo}
      IDENTITY_DEMO_USERS_ENABLED: "true"
    ports:
      # Solo para probar el servicio aislado. En el entorno compartido nadie publica este puerto:
      # el unico puerto expuesto al host es el 8080 del gateway.
      - "8081:8081"

volumes:
  identity-mysql-data:
