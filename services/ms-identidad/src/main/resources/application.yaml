server:
  port: ${SERVER_PORT:8081}
  # El JWT lleva el claim permissions del catalogo granular (RBAC-01): el de un administrador
  # supera los 7 KB y los 8 KB por defecto de Tomcat no dejan margen para el resto de cabeceras.
  max-http-request-header-size: 32KB

spring:
  application:
    name: ms-identidad

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized

  health:
    redis:
      enabled: true

medicalsys:
  identity:
    jwt:
      issuer: ${JWT_ISSUER:medicalsys-ms-identidad}
      secret: ${JWT_SECRET}
      access-token-ttl: ${JWT_ACCESS_TTL:PT1H}
    # IAM-03: las credenciales, la política de contraseñas y el bloqueo al 3er intento viven en
    # Keycloak (infra/keycloak). ms-identidad solo las valida y sigue emitiendo su propio JWT.
    keycloak:
      base-url: ${KEYCLOAK_URL:http://keycloak:8080}
      realm: ${KEYCLOAK_REALM:medicalsys}
      client-id: ${KEYCLOAK_CLIENT_ID:ms-identidad}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
      timeout: ${KEYCLOAK_TIMEOUT:PT5S}
    demo-users:
      enabled: ${IDENTITY_DEMO_USERS_ENABLED:false}
      # Debe coincidir con el public_id de la organización DEMO sembrada por ms-tenencia.
      organization-public-id: ${IDENTITY_DEMO_ORGANIZATION:00000000-0000-4000-8000-0000000000a1}
      password: ${IDENTITY_DEMO_PASSWORD:SanGabriel.Demo26!}
    platform-admin:
      enabled: ${PLATFORM_ADMIN_SEED_ENABLED:false}
      public-id: ${PLATFORM_ADMIN_PUBLIC_ID:00000000-0000-4000-8000-000000000900}
      # El rol es global, pero el JWT necesita un tenant de contexto para atravesar el gateway.
      organization-public-id: ${PLATFORM_ADMIN_ORGANIZATION:${IDENTITY_DEMO_ORGANIZATION:00000000-0000-4000-8000-0000000000a1}}
      email: ${PLATFORM_ADMIN_EMAIL:platform.admin@medicalsys.demo}
      full-name: ${PLATFORM_ADMIN_FULL_NAME:Administrador de MedicalSys}
      password: ${PLATFORM_ADMIN_PASSWORD:}
